services:
  - type: web
    name: viet-phuc-remix-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: FRONTEND_URL
        value: https://viet-phuc-remix-web.onrender.com
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: viet-phuc-remix-web
    runtime: static
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://viet-phuc-remix-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
